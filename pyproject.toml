[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "driftops"
version = "0.1.0"
description = "MLOps lifecycle under real concept drift: drift monitoring, retraining policies, champion/challenger registry and a SageMaker-compatible serving container, measured on the Elec2 electricity market stream."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "fastapi>=0.110",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27", "uvicorn>=0.29"]
serve = ["uvicorn>=0.29"]
tracking = ["mlflow>=2.10"]

[project.scripts]
driftops = "driftops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/driftops"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
