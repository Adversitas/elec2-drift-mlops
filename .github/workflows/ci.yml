name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Short policy replay (20 weeks, logistic regression)
        run: driftops benchmark --weeks 20 --models logreg --out ci-reports
      - name: Train, register and smoke-test the serving contract
        run: |
          driftops train --model logreg --registry ci-registry
          (driftops serve --registry ci-registry --port 8080 &) && sleep 5
          curl -sf localhost:8080/ping
          curl -sf -X POST localhost:8080/invocations -H "content-type: text/csv" \
            --data-binary "3,0.5,0.06,0.42,0.003,0.42,0.41,0.0,-1.0"

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t driftops .
